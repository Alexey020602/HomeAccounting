services:
  db:
    image: "docker.io/library/postgres:latest"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${USERNAME:-homeaccounting}"
      POSTGRES_PASSWORD: "${PASSWORD:-change-me}"
      POSTGRES_DB: "HomeAccounting"
    expose:
      - "5432"
    volumes:
      - "homeaccounting-db-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${USERNAME:-homeaccounting}", "-d", "HomeAccounting"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    restart: unless-stopped
    networks:
      - "app"
      - "observability"

  api:
    image: "${API_IMAGE:-ghcr.io/alexey020602/homeaccounting-web:latest}"
    pull_policy: always
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      ConnectionStrings__homeaccounting-db: "Host=db;Port=5432;Username=${USERNAME:-homeaccounting};Password=${PASSWORD:-change-me};Database=HomeAccounting"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.namespace=homeaccounting,service.version=${API_VERSION:-latest}"
      OTEL_SERVICE_NAME: "homeaccounting"
    ports:
      - "${API_PORT:-5000}:8080"
    expose:
      - "8081"
    depends_on:
      db:
        condition: "service_healthy"
    restart: unless-stopped
    networks:
      - "app"
      - "observability"

networks:
  app:
    driver: "bridge"

  observability:
    external: true
    name: "observability"

volumes:
  homeaccounting-db-data:
    driver: "local"
