apiVersion: 1

policies:
  - orgId: 1
    receiver: default-webhook
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: default-webhook
        object_matchers:
          - [severity, =, critical]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 30m
      - receiver: default-webhook
        object_matchers:
          - [severity, =, warning]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
